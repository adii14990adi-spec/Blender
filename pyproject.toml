[project]
name = "modular-clothing-pipeline"
version = "1.0.0"
description = "Headless Blender modular clothing pipeline with Arena Agent orchestration"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "PL", "RUF"]
fixable = ["F", "I"]
unfixable = []
# outputs/ is intentionally not LFS-tracked (CI artifacts).

[tool.ruff.lint.isort]
known-first-party = ["bpy_scripts"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit",
    "integration",
]
