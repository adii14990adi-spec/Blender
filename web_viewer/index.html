<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0c10" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Atelier - real-time studio for the Blender garment pipeline: view, inspect and download validated clothing exports." />
<title>Atelier · Garment Studio</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/styles.css" />
<!-- Vendored build of Google's model-viewer (BSD-3-Clause) so the studio needs
     no third-party CDN at runtime and works offline. -->
<script type="module" src="vendor/model-viewer.min.js"></script>
</head>
<body data-panel="outfits">

<a class="skip-link" href="#stage">Skip to viewer</a>

<header class="app-bar">
  <div class="brand">
    <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 2.5 29 9v14L16 29.5 3 23V9z" fill="none" stroke="currentColor" stroke-width="1.6" />
      <path d="M16 9.5 22 13v6l-6 3.5L10 19v-6z" fill="currentColor" opacity=".55" />
    </svg>
    <span class="brand__text">
      <strong>Atelier</strong>
      <span>Garment Studio</span>
    </span>
  </div>

  <div class="character-switch" role="group" aria-label="Character">
    <div class="segmented" data-role="characters" data-state="loading">
      <span class="segmented__skeleton" aria-hidden="true"></span>
      <span class="segmented__skeleton" aria-hidden="true"></span>
    </div>
  </div>

  <div class="app-bar__meta">
    <span class="pill" data-role="build-pill" data-tone="muted" hidden>
      <span class="pill__count" data-role="build-count"></span>
      <span class="pill__label" data-role="build-label">validated</span>
    </span>
    <a class="icon-button" data-role="docs-link" href="reports/BUILD_REPORT.md" title="Build report" aria-label="Build report">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h7l5 5v11H7z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M14 4v5h5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 13h6M10 16.5h6" stroke="currentColor" stroke-width="1.6"/></svg>
    </a>
  </div>
</header>

<main class="studio">

  <!-- desktop: outfit library ------------------------------------------------ -->
  <aside class="sidebar" aria-label="Outfit library">
    <div class="sidebar__head">
      <h2 class="eyebrow">Outfit library</h2>
      <span class="count" data-role="outfit-count">—</span>
    </div>
    <div class="outfit-grid" data-role="outfit-grid" role="list"></div>
    <div class="sidebar__foot">
      <span data-role="pipeline-version">pipeline —</span>
      <span data-role="generated-at">manifest —</span>
    </div>
  </aside>

  <!-- centre: 3D stage ------------------------------------------------------ -->
  <section class="stage" id="stage" aria-label="3D viewer">
    <div class="stage__frame" data-role="stage-frame">
      <model-viewer
        data-role="model"
        alt=""
        camera-controls
        touch-action="pan-y"
        interaction-prompt="none"
        shadow-intensity="0.85"
        shadow-softness="0.85"
        environment-image="neutral"
        tone-mapping="neutral"
        exposure="1.0"
        camera-orbit="-28deg 78deg auto"
        field-of-view="30deg"
        min-field-of-view="12deg"
        max-field-of-view="55deg"
        min-camera-orbit="auto 20deg auto"
        max-camera-orbit="auto 105deg auto"
        loading="eager"
        reveal="auto"
      ></model-viewer>

      <!-- state overlays -->
      <div class="overlay" data-role="overlay-loading" hidden>
        <div class="overlay__card">
          <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-role="progress">
            <span class="progress__bar" data-role="progress-bar"></span>
          </div>
          <p class="overlay__title" data-role="loading-title">Loading garment…</p>
          <p class="overlay__hint" data-role="loading-hint">0%</p>
        </div>
      </div>

      <div class="overlay" data-role="overlay-error" hidden>
        <div class="overlay__card overlay__card--error">
          <h3 class="overlay__title">Could not load this garment</h3>
          <p class="overlay__hint" data-role="error-message"></p>
          <div class="overlay__actions">
            <button class="button button--primary" data-action="retry" type="button">Try again</button>
            <button class="button" data-action="next-variant" type="button">Other character</button>
          </div>
        </div>
      </div>

      <div class="overlay" data-role="overlay-empty" hidden>
        <div class="overlay__card">
          <h3 class="overlay__title" data-role="empty-title">No builds published yet</h3>
          <p class="overlay__hint" data-role="empty-message"></p>
          <div class="overlay__actions">
            <button class="button button--primary" data-action="reload" type="button">Reload manifest</button>
          </div>
        </div>
      </div>

      <!-- viewport HUD -->
      <div class="stage__hud stage__hud--top">
        <div class="hud-card">
          <p class="hud-card__title" data-role="hud-outfit">—</p>
          <p class="hud-card__sub" data-role="hud-variant">—</p>
        </div>
      </div>

      <div class="stage__hud stage__hud--bottom">
        <div class="hud-actions" role="toolbar" aria-label="Viewport controls">
          <button class="icon-button" data-action="reset-camera" type="button" title="Reset camera (R)" aria-label="Reset camera">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
          </button>
          <button class="icon-button" data-action="autorotate" type="button" aria-pressed="false" title="Auto-rotate (O)" aria-label="Auto-rotate">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 0 1 14.6-5.9M20.5 12a8.5 8.5 0 0 1-14.6 5.9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M18 3v4h-4M6 21v-4h4" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
          </button>
          <button class="icon-button" data-action="animation" type="button" aria-pressed="false" hidden title="Play / pause animation (space)" aria-label="Play or pause animation">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path data-role="animation-icon" d="M8 5.5v13l10-6.5z" fill="currentColor"/></svg>
          </button>
          <button class="icon-button" data-action="fullscreen" type="button" aria-pressed="false" title="Fullscreen (F)" aria-label="Toggle fullscreen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 15v5h-5M15 4h5v5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
          </button>
        </div>
        <p class="hud-hint" data-role="model-hint">Drag to orbit · pinch to zoom</p>
      </div>
    </div>
  </section>

  <!-- desktop: properties --------------------------------------------------- -->
  <aside class="properties" aria-label="Asset details">
    <div class="properties__scroll" data-role="asset-panels"></div>
  </aside>

  <!-- mobile: bottom sheet -------------------------------------------------- -->
  <section class="sheet" aria-label="Studio panels">
    <div class="sheet__head">
      <h2 class="eyebrow" data-role="sheet-title">Outfits</h2>
      <span class="count" data-role="sheet-count"></span>
    </div>
    <div class="sheet__body">
      <div class="sheet__panel" data-panel-name="outfits">
        <div class="outfit-grid outfit-grid--compact" data-role="outfit-grid" role="list"></div>
      </div>
      <div class="sheet__panel" data-panel-name="view" hidden>
        <div class="view-panel" data-role="view-panel"></div>
      </div>
      <div class="sheet__panel" data-panel-name="asset" hidden>
        <div data-role="asset-panels"></div>
      </div>
    </div>
  </section>
</main>

<nav class="tab-bar" aria-label="Sections">
  <button class="tab" data-panel-target="outfits" type="button" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l3 1.6L15 4l4 2.4-1.6 3L21 12l-1.6 2.6L16 13v7H8v-7l-3.4 1.6L3 12l3.6-2.6L5 6.4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <span>Outfits</span>
  </button>
  <button class="tab" data-panel-target="view" type="button" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/></svg>
    <span>View</span>
  </button>
  <button class="tab" data-panel-target="asset" type="button" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v12H4z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 7l4-3h8l4 3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9.5 12.5 12 15l3-3.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    <span>Asset</span>
  </button>
</nav>

<div class="toast" data-role="toast" role="status" aria-live="polite" hidden></div>

<noscript>
  <div class="noscript">This studio renders 3D garments and needs JavaScript enabled.</div>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
