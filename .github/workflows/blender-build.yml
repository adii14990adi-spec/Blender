name: Blender Build

# On merge to main: full pipeline + export + deploy web viewer.
on:
  push:
    branches: [main]
    paths: ["blender/**", "prompts/**", "assets/**", ".github/workflows/blender-build.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install headless Blender 5.0.0
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              wget xvfb python3-pip libgl1 libxi6 libxrender1
          wget -q https://download.blender.org/release/Blender5.0/blender-5.0.0-linux-x64.tar.xz
          sudo tar -xf blender-5.0.0-linux-x64.tar.xz -C /opt
          sudo ln -sf /opt/blender-5.0.0-linux-x64/blender /usr/local/bin/blender
          rm -f blender-5.0.0-linux-x64.tar.xz
          blender --version

      - name: Run full pipeline and export FBX
        run: |
          blender -b --python blender/run_pipeline.py -- \
            --stage export \
            --blend assets/base_body/BASE_BODY.blend \
            --region UPPER_BODY \
            --params '{"outfit": "jacket_urban_01"}' \
            --out /tmp/build.json

      - uses: actions/upload-artifact@v4
        with:
          name: clothing-build
          path: outputs/

      - name: Prepare docs folder for GitHub Pages
        run: |
          rm -rf docs
          mkdir -p docs/outputs/jacket_urban_01
          cp web_viewer/index.html docs/index.html
          cp outputs/jacket_urban_01/*.glb docs/outputs/jacket_urban_01/
          find docs -type f

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3
