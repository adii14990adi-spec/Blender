name: Blender Build

# On merge to main: full pipeline + export. Uploads outputs/** as a build artifact
# (or pushes to your asset CDN / Unity project via Unity Cloud Build trigger).
on:
  push:
    branches: [main]
    paths: ["blender/**", "prompts/**", "assets/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install headless Blender 5.0.0
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              wget xvfb python3-pip libgl1 libxi6 libxrender1
          wget -q https://download.blender.org/release/Blender5.0/blender-5.0.0-linux-x64.tar.xz
          sudo tar -xf blender-5.0.0-linux-x64.tar.xz -C /opt
          sudo ln -sf /opt/blender-5.0.0-linux-x64/blender /usr/local/bin/blender
          rm -f blender-5.0.0-linux-x64.tar.xz
          blender --version

      - name: Run full pipeline and export FBX
        run: |
          blender -b --python blender/run_pipeline.py -- \
            --stage export \
            --blend assets/base_body/BASE_BODY.blend \
            --region UPPER_BODY \
            --params '{"outfit": "jacket_urban_01"}' \
            --out /tmp/build.json

      - name: Assert build produced outputs
        run: |
          python -c "
          import json, os, sys
          r = json.load(open('/tmp/build.json'))
          assert r['status'] == 'pass', r
          glb = r['metrics'].get('glb_path', '')
          assert glb and os.path.exists(glb), f'glb missing: {glb}'
          print('BUILD PASS:', r['metrics'])
          " || { echo "BUILD FAILED"; cat /tmp/build.json; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: clothing-build
          path: outputs/
