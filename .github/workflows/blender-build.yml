name: Blender Build

# On merge to main: full pipeline + export + deploy web viewer to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["blender/**", "prompts/**", "assets/**"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install headless Blender 5.0.0
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              wget xvfb python3-pip libgl1 libxi6 libxrender1
          wget -q https://download.blender.org/release/Blender5.0/blender-5.0.0-linux-x64.tar.xz
          sudo tar -xf blender-5.0.0-linux-x64.tar.xz -C /opt
          sudo ln -sf /opt/blender-5.0.0-linux-x64/blender /usr/local/bin/blender
          rm -f blender-5.0.0-linux-x64.tar.xz
          blender --version

      # Git LFS pointers look like 130-byte text files; a real .blend starts
      # with the "BLENDER" magic. Print both so LFS/asset problems are obvious.
      - name: Inspect base body asset
        run: |
          ls -la assets/base_body/
          head -c 64 assets/base_body/BASE_BODY.blend | od -c | head -4

      - name: Run full pipeline and export FBX/GLB
        run: |
          # --python-exit-code 1 makes Blender fail the step on an uncaught
          # Python error instead of exiting 0.
          blender -b --python-exit-code 1 --python blender/run_pipeline.py -- \
            --stage full \
            --blend assets/base_body/BASE_BODY.blend \
            --region UPPER_BODY \
            --params '{"outfit": "jacket_urban_01"}' \
            --out /tmp/build.json

      # The blender step now exits non-zero on failure, so the assert below may
      # never run — dump the failure JSON so the reason is visible in the log.
      - name: Show build result on failure
        if: failure()
        run: |
          echo "--- /tmp/build.json ---"
          cat /tmp/build.json 2>/dev/null || echo "(no build.json written)"
          echo "--- outputs/ ---"
          ls -laR outputs 2>/dev/null || true

      - name: Assert build produced outputs
        run: |
          python -c "
          import json, os
          r = json.load(open('/tmp/build.json'))
          m = r['metrics']
          assert r['status'] == 'pass', r
          assert not m.get('glb_is_fallback'), f'fallback GLB produced: {m}'
          glb = m.get('glb_path') or ''
          assert glb and os.path.exists(glb), f'glb missing: {glb}'
          assert m.get('glb_file_size_bytes', 0) > 1024, f'glb suspiciously small: {m}'
          assert r.get('checkpoint'), 'no final checkpoint produced'
          print('BUILD PASS:', m)
          " || { echo "BUILD FAILED"; cat /tmp/build.json; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: clothing-build
          path: outputs/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Prepare docs folder
        run: |
          rm -rf docs
          mkdir -p docs/outputs/jacket_urban_01
          cp web_viewer/index.html docs/index.html
          cp outputs/jacket_urban_01/*.glb docs/outputs/jacket_urban_01/
          find docs -type f

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3
