name: Build & Deploy Assets

# Production build: runs the real Blender 5.0 pipeline for both body variants,
# validates every exported FBX/GLB (project inspectors + Khronos glTF
# Validator), writes a build report and only then deploys the *validated*
# assets to GitHub Pages. A failed or incomplete build publishes nothing.

on:
  push:
    branches: [main]
    paths:
      - "blender/**"
      - "assets/**"
      - "tools/**"
      - "web_viewer/**"
      - ".github/workflows/blender-build.yml"
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: male
            outfit: jacket_urban_01
          - variant: female
            outfit: jacket_urban_01
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: ./.github/actions/setup-blender

      - name: Install Khronos glTF Validator
        run: npm ci --no-audit --no-fund

      - name: Verify base body for ${{ matrix.variant }}
        run: |
          set -euo pipefail
          BODY=$(python -c "import sys;sys.path.insert(0,'blender');from bpy_scripts import config;print(config.resolve_variant('${{ matrix.variant }}').path)")
          echo "base body: ${BODY}"
          head -c 7 "${BODY}" | grep -q BLENDER || { echo "::error::${BODY} is not a Blender file"; exit 1; }

      - name: Run pipeline (${{ matrix.variant }})
        run: |
          set -euo pipefail
          blender -b --python-exit-code 1 --python blender/run_pipeline.py -- \
            --stage full \
            --variant ${{ matrix.variant }} \
            --outfit ${{ matrix.outfit }} \
            --out "/tmp/build_${{ matrix.variant }}.json"

      - name: Show pipeline report
        if: always()
        run: cat "/tmp/build_${{ matrix.variant }}.json" 2>/dev/null || echo "(no build JSON)"

      - name: Validate exports
        run: |
          set -euo pipefail
          python tools/validate_exports.py \
            --outfit ${{ matrix.outfit }} \
            --variant ${{ matrix.variant }} \
            --khronos \
            --json "/tmp/exports_${{ matrix.variant }}.json"

      - name: Upload validated assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.variant }}
          # Only shippable artifacts (never the .blend checkpoints).
          path: |
            outputs/${{ matrix.variant }}/${{ matrix.outfit }}/*.fbx
            outputs/${{ matrix.variant }}/${{ matrix.outfit }}/*.glb
            outputs/${{ matrix.variant }}/${{ matrix.outfit }}/*.json
          if-no-files-found: error

  report:
    name: Build report
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: assets-male
          path: downloads/male
      - uses: actions/download-artifact@v4
        with:
          name: assets-female
          path: downloads/female

      - name: Generate reports
        run: |
          set -euo pipefail
          python tools/build_report.py \
            --run "male=downloads/male/validation_report.json" \
            --run "female=downloads/female/validation_report.json" \
            --out reports/BUILD_REPORT.md \
            --json reports/build_report.json

      - uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: reports/
          if-no-files-found: error

  deploy:
    name: Deploy validated assets to Pages
    needs: [build, report]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: assets-male
          path: site/outputs/male/jacket_urban_01
      - uses: actions/download-artifact@v4
        with:
          name: assets-female
          path: site/outputs/female/jacket_urban_01
      - uses: actions/download-artifact@v4
        with:
          name: build-reports
          path: site/reports

      - name: Re-validate what is about to be published
        run: |
          set -euo pipefail
          for variant in male female; do
            echo "== re-validating ${variant} =="
            python tools/validate_exports.py \
              "site/outputs/${variant}/jacket_urban_01/jacket_urban_01_Modular.glb" \
              "site/outputs/${variant}/jacket_urban_01/jacket_urban_01_Modular.fbx" \
              --require-skin
          done

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          cp web_viewer/index.html site/index.html
          # Only export artifacts are published - never .blend checkpoints.
          find site -name "*.blend*" -delete
          find site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
