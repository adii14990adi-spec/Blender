name: Nightly Regression

# Rebuilds every outfit in assets/references/ against the current prompt version.
# Catches prompt changes that break one outfit but not another before artists do.
on:
  schedule:
    - cron: "0 2 * * *"   # daily 02:00 UTC
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        outfit: [jacket_urban_01]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install headless Blender 5.0.0
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              wget xvfb python3-pip libgl1 libxi6 libxrender1
          wget -q https://download.blender.org/release/Blender5.0/blender-5.0.0-linux-x64.tar.xz
          sudo tar -xf blender-5.0.0-linux-x64.tar.xz -C /opt
          sudo ln -sf /opt/blender-5.0.0-linux-x64/blender /usr/local/bin/blender
          rm -f blender-5.0.0-linux-x64.tar.xz
          blender --version

      - name: Run pipeline for outfit ${{ matrix.outfit }}
        run: |
          blender -b --python blender/run_pipeline.py -- \
            --stage export \
            --blend assets/base_body/BASE_BODY.blend \
            --region UPPER_BODY \
            --params "{\"outfit\": \"${{ matrix.outfit }}\"}" \
            --out /tmp/regression_${{ matrix.outfit }}.json

      - name: Assert regression passed
        run: |
          python -c "
          import json, sys
          r = json.load(open('/tmp/regression_${{ matrix.outfit }}.json'))
          assert r['status'] == 'pass', r
          print('REGRESSION PASS:', r['metrics'])
          " || { echo "REGRESSION FAILED for ${{ matrix.outfit }}"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.outfit }}
          path: /tmp/regression_${{ matrix.outfit }}.json
