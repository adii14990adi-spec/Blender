name: Setup Blender
description: Install headless Blender 5.0 and the system libraries it needs
inputs:
  version:
    description: Blender version to install
    required: false
    default: "5.0.0"
  series:
    description: Release series directory on download.blender.org
    required: false
    default: "Blender5.0"
outputs:
  blender:
    description: Path to the blender executable
    value: /usr/local/bin/blender
runs:
  using: composite
  steps:
    - name: Install system libraries
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          wget xz-utils ca-certificates \
          libgl1 libglx-mesa0 libxi6 libxrender1 libxxf86vm1 libxfixes3 \
          libxkbcommon0 libsm6 libice6 libx11-6 libxext6

    - name: Download and verify Blender
      shell: bash
      env:
        BLENDER_VERSION: ${{ inputs.version }}
        BLENDER_SERIES: ${{ inputs.series }}
      run: |
        set -euo pipefail
        BASE="https://download.blender.org/release/${BLENDER_SERIES}"
        TARBALL="blender-${BLENDER_VERSION}-linux-x64.tar.xz"

        wget -q --tries=3 --timeout=60 -O "${TARBALL}" "${BASE}/${TARBALL}"

        if wget -q --tries=2 --timeout=30 -O blender.sha256 "${BASE}/blender-${BLENDER_VERSION}.sha256"; then
          EXPECTED="$(grep -oE '[0-9a-f]{64}' blender.sha256 | head -1 || true)"
          if [ -n "${EXPECTED}" ]; then
            ACTUAL="$(sha256sum "${TARBALL}" | cut -d' ' -f1)"
            if [ "${ACTUAL}" != "${EXPECTED}" ]; then
              echo "::error::Blender checksum mismatch (got ${ACTUAL}, expected ${EXPECTED})"
              exit 1
            fi
            echo "Blender checksum OK: ${ACTUAL}"
          else
            echo "::warning::blender.sha256 present but unparsable; skipping checksum"
          fi
        else
          echo "::warning::no blender-${BLENDER_VERSION}.sha256 published; skipping checksum"
        fi

        sudo mkdir -p /opt/blender
        sudo tar -xf "${TARBALL}" -C /opt/blender --strip-components=1
        sudo ln -sf /opt/blender/blender /usr/local/bin/blender
        rm -f "${TARBALL}" blender.sha256
        blender --version
